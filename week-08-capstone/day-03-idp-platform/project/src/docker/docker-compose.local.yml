# --- Docker Compose for Local Development ---
# Use this file to test the OpenWebUI setup locally before deploying to AWS.
# This uses a LOCAL PostgreSQL container instead of RDS.

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: always
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URL=postgresql://idpadmin:localpass@postgres:5432/openwebui
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE_URLS=https://api.openai.com/v1
      - WEBUI_SECRET_KEY=local-dev-secret-change-me
      - ENABLE_SIGNUP=true
    volumes:
      - openwebui-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: always
    environment:
      POSTGRES_USER: idpadmin
      POSTGRES_PASSWORD: localpass
      POSTGRES_DB: openwebui
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idpadmin -d openwebui"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openwebui-data:
  pgdata:
