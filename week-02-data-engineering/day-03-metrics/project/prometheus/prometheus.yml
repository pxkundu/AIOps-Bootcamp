global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'shopfast-production'
    environment: 'development'

# Load recording rules
rule_files:
  - "recording_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # API Gateway Exporter
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:8001']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # User Service Exporter
  - job_name: 'user-service'
    static_configs:
      - targets: ['host.docker.internal:8002']
    scrape_interval: 15s

  # Order Service Exporter
  - job_name: 'order-service'
    static_configs:
      - targets: ['host.docker.internal:8003']
    scrape_interval: 15s

  # Payment Service Exporter
  - job_name: 'payment-service'
    static_configs:
      - targets: ['host.docker.internal:8004']
    scrape_interval: 15s

  # Inventory Service Exporter
  - job_name: 'inventory-service'
    static_configs:
      - targets: ['host.docker.internal:8005']
    scrape_interval: 15s

  # Remote write configuration (optional)
  # remote_write:
  #   - url: "http://remote-write-adapter:8080/receive"
  #     queue_config:
  #       max_samples_per_send: 1000
  #       batch_send_deadline: 5s
