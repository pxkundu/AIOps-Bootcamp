# Solution: Exercise 1 - Logstash Configuration

This is a robust Logstash configuration that handles JSON input, adds GeoIP, and tags high-latency requests.

```ruby
input {
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # 1. Enrichment: Basic GeoIP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
    }
  }

  # 2. Logic: Tagging High Latency (AIOps Feature Extraction)
  if [latency] > 1500 {
    mutate {
      add_tag => [ "high_latency" ]
      add_field => { "performance_category" => "critical" }
    }
  } else {
    mutate {
      add_field => { "performance_category" => "normal" }
    }
  }

  # 3. Cleanup: Removing noisy metadata
  mutate {
    remove_field => ["@version", "host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "aiops-logs-%{+YYYY.MM.dd}"
    # Ensure mapping handles numbers correctly
  }

  # Debugging (optional)
  # stdout { codec => rubydebug }
}
```
